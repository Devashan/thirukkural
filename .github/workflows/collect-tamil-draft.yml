name: Collect Tamil review draft

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Previous collection run whose snapshots should be reused
        default: "36273814427"
        required: false
  pull_request:
    paths:
      - tools/collect_tamil.py
      - .github/workflows/collect-tamil-draft.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: tamil-collection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test chapter parsing
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/download-artifact@v4
        with:
          name: tamil-review-draft
          path: ${{ runner.temp }}/tamil-draft/
          run-id: ${{ inputs.resume_run_id || '36273814427' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture 133 pinned source revisions and extract review records
        run: python3 tools/collect_tamil.py "$RUNNER_TEMP/tamil-draft"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamil-review-draft
          path: ${{ runner.temp }}/tamil-draft/
          retention-days: 30
